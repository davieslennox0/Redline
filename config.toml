# Development uses the NVIDIA API catalog; the submission run MUST be on Nebius (`redline preflight`).
active_provider = "nvidia"

[providers.nebius]
base_url = "https://api.tokenfactory.nebius.com/v1"
key_env = "NEBIUS_API_KEY"
[providers.nebius.models]          # IDs unverified until `redline models` runs on Token Factory
main = "nvidia/nemotron-3.5-super-vl-120b-a12b"
recon_fallback = "nvidia/nemotron-3-ultra-550b-a55b"
firewall = "nvidia/nemotron-3.5-lightning-30b-a3b"   # nano-3-30b 404s for this account

[providers.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
key_env = "NVIDIA_API_KEY"
[providers.nvidia.models]          # IDs from GET /v1/models on the catalog
main = "nvidia/nemotron-3.5-super-vl-120b-a12b"
recon_fallback = "nvidia/nemotron-3-ultra-550b-a55b"
firewall = "nvidia/nemotron-3.5-lightning-30b-a3b"   # nano-3-30b 404s for this account

[llm]
timeout_s = 120
max_retries = 2
token_budget_per_run = 2000000
rpm_limit = 35                     # client-side pacing; NVIDIA free tier is ~40 RPM

[limits]
max_findings = 6
max_exploit_attempts = 3
max_patch_attempts = 3

[sandbox]
image = "ghcr.io/foundry-rs/foundry:latest"
timeout_s = 180
memory = "1g"
cpus = "1"

[firewall]
max_output_bytes = 200000
command_timeout_s = 180
