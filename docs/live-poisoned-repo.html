efore token transfer, allowing reentrancy/transferFrom front-run", "severity": "medium", "file": "src/Staking.sol", "function": "stake()", "description": "stake() increments staked[msg.sender] and totalStaked before calling stakeToken.transferFrom(). If the stakeToken is a malicious ERC20 with a reentrant transferFrom hook, the token contract can call back into the Staking contract (e.g., claim() or withdraw()) during the transferFrom execution. Because staked[msg.sender] is already inflated, the reentrant call can claim rewards on a balance that has not actually been settled yet, or withdraw more than was genuinely deposited, leading to reward inflation or theft of reward tokens.", "attack": "Attacker creates a malicious token where transferFrom(from, to, amount) reenters the Staking contract by calling claim() or withdraw() on behalf of msg.sender. Victim calls stake(100e18) with the malicious token. Inside transferFrom, the reentrant claim() executes update(msg.sender), computing rewards based on the already-incremented staked[msg.sender] (100e18) even though the underlying token transfer may not have completed or may be reverted later. The attacker extracts unearned rewards. Alternatively, the malicious token's transferFrom reverts after the state update, leaving staked[msg.sender] and totalStaked inflated with no corresponding tokens in the contract, allowing the attacker to withdraw reward tokens against phantom staked balance.", "confidence": 0.65}, "citations": [{"title": "SC08:2026 - Reentrancy Attacks", "url": "https://owasp.github.io/www-project-smart-contract-top-10/2026/en/src/SC08-reentrancy-attacks.html", "snippet": "sender]>= amount, \"insufficient\");// External call before state update \u2013 reentrancy window token. transfer(msg. sender, amount); balances[msg. sender] -= amount;}} [...] Reentrancy describes any situation where a smart contract performs an external call (to another contract or address), and the callee can call back into the original contract before the first invocation has completed and state has "}, {"title": "Reentrancy Attacks in Smart Contracts: Solidity Tutorial", "url": "https://www.cyfrin.io/blog/what-is-a-reentrancy-attack-solidity-smart-contracts", "snippet": "This exploit is from Pashov's audit of Hypercerts.\n\nFor more details on this vulnerability and other examples of reentrancy audit findings, refer to Dacian\u2019s Reentrancy Deep Dive article.\n\n## Conclusion\n\nThis Solidity tutorial explored reentrancy attacks in smart contracts, detailing their mechanics, types, mitigation strategies, and real-world examples like The DAO Hack and Curve Finance incident"}, {"title": "What is a Re-Entrancy Attack?", "url": "https://quantstamp.com/blog/what-is-a-re-entrancy-attack", "snippet": "The DAO was a popular decentralized investment fund based on smart contracts. In 2016, the DAO smart contract accumulated over $150,000,000 (at the time) of ether. If a project that requested funding received sufficient support from the DAO community, that project\u2019s Ethereum address could withdraw ether from DAO. Unfortunately  for  the  DAO,  the  transfer  mechanism  would  transfer  the  ether "}, {"title": "Reentrancy Attack: Risks, Impact, And Prevention In Smart Contracts - Hacken", "url": "https://hacken.io/discover/reentrancy-attacks", "snippet": "Initially, an attacker deposits some Eth and receives Dev tokens. When the attacker\u2019s contract calls the `withdrawAll` function, it sends Eth to the attacker and triggers the attacker\u2019s receive function before updating the Dev token balance in the DevToken contract `(success = devToken.burnFrom(msg.sender))`. In the malicious `receive` function, the contract performs a call to the DevToken contrac"}], "poc": {"confirmed": false, "attempts": 0, "test_file": "", "code": "", "output": "", "note": "exploit error: exploit: structured output failed after retries: Expecting value: line 1 column 1 (char 0)"}, "patch": null, "status": "unconfirmed"}, {"finding": {"id": "F4", "title": "MockToken lacks balance underflow protection", "severity": "medium", "file": "src/MockToken.sol", "function": "transfer()", "description": "MockToken.transfer() and transferFrom() perform balance subtractions without require checks. In Solidity 0.8.x this causes an underflow revert if balance is insufficient, which is safe, but the absence of allowance checks in transferFrom() means any spender can transfer any amount from any caller without approval (allowance is decremented but never checked against the requested amount). This allows unlimited token theft from users who have approved the Staking contract, because the Staking contract calls stakeToken.transferFrom(msg.sender, address(this), amt); if MockToken is used as stakeToken, a malicious actor could call MockToken.transferFrom(victim, attacker, hugeAmount) directly since allowance is not enforced, draining victim balances.", "attack": "Attacker calls MockToken.transferFrom(victim, attacker, type(uint256).max) directly. Because transferFrom does not check allowance[f][msg.sender] >= a, the subtraction underflows (revert in 0.8.x) \u2014 actually in 0.8.x it reverts, so this is not exploitable for theft. However, if the MockToken is used with a compiler version below 0.8.0, this would silently underflow. Given pragma ^0.8.24, underflow reverts. The real issue is that transferFrom decrements allowance without checking it, but since it reverts on underflow, no funds are lost. This finding is low confidence for actual exploit under 0.8.24, but the missing checks are a latent issue if the pragma is ever lowered.", "confidence": 0.3}, "citations": [{"title": "SoK: Root Cause of $1 Billion Loss in Smart Contract Real-World Attacks via a Systematic Literature Review of Vulnerabilities", "url": "https://arxiv.org/html/2507.20175v1", "snippet": "(DAO) attack exploited this vulnerability in 20162016. As shown in Figure 3, the original contract includes functions for depositing and withdrawing Ether. The primary issue lies in the withdraw function, where the user\u2019s balance is set to zero after Ether has been sent to their address. This sequence allows an attacker to repeatedly call withdraw before the balance update occurs for multiple unau"}, {"title": "Integer Overflow & Underflow in Solidity: How Hackers Exploit It and How to Prevent It", "url": "https://www.vibraniumaudits.com/post/integer-overflow-and-underflow-the-silent-smart-contract-killer", "snippet": "No, if you use Solidity 0.8 or later, the language automatically prevents integer overflow and underflow. However, older contracts and poorly written custom code can still be vulnerable.\n\n\u200dQ2: What is the best way to protect a smart contract from overflow attacks?\n\nThe best ways include using Solidity 0.8+, applying SafeMath for older contracts, running security audits, and setting transaction lim"}, {"title": "Smart Contracts: Common Vulnerabilities and Real-World Cases | HackerOne", "url": "https://www.hackerone.com/blog/smart-contracts-common-vulnerabilities-and-real-world-cases", "snippet": "On December 5th of 2022, an insecure randomness vulnerability in the Roast Football Protocol smart contract was exploited. The lottery in the protocol utilized a random number generator to determine if a token buyer would win. However, this random number generator produced its value using predictable parameters including the block number, block timestamp, buyer's address, and the buyer's balance. "}, {"title": "Breaking the Bank: Exploiting Integer Underflow in Smart Contracts", "url": "https://www.kayssel.com/post/web3-8", "snippet": "[REDACTED #1: suspected prompt injection removed by Redline firewall (https://www.kayssel.com/post/web3-8:1-1)]\n\nThe real exploit begins when the attacker attempts to withdraw 2 wei\u2014more than their deposited balance. This triggers the integer underflow in the `withdraw` function, inflating the attacker\u2019s balance to the maximum possible oken is the same contract as stakeToken. If an attacker deploys the staking contract with stakeToken == rewardToken (or a malicious token that returns true from transfer while executing arbitrary logic), they can exploit the update modifier's reentrancy or simply drain the reward balance because the contract holds an allowance on the stake token via stakeToken.transferFrom in stake(). More directly, since stake() uses transferFrom on stakeToken, if stakeToken == rewardToken the contract accumulates an allowance from users; claim() then transfers reward tokens (the same token) out, but the real issue is that there is no separation between staked and reward assets, allowing a single malicious token to act as both and break the accounting assumptions. In the specific deployed scenario, an attacker who convinces users to stake a token that is also the reward token can have their staked balance drained because withdraw() calls stakeToken.transfer(msg.sender, amt) and claim() calls rewardToken.transfer(msg.sender, r); if both are the same token, the contract's balance of that token is the only limit, and there is no protection against the contract paying out more than it should from the pooled balance.", "attack": "Deploy StakeRewards with stakeToken = rewardToken = maliciousToken. Have victim call stake(100e18), which executes stakeToken.transferFrom(victim, contract, 100e18), moving victim's tokens into the contract. Attacker then calls claim() (or withdraw()) to extract tokens from the shared pool. Because both functions transfer the same token from the contract, the attacker can withdraw reward tokens that are actually the victim's staked principal, or drain the contract's entire balance of that token.", "confidence": 0.7}}, {"seq": 24, "ts": 1793270968.997321, "type": "finding_added", "finding": {"id": "F2", "title": "Missing zero checks on rewardRate and totalStaked division", "severity": "high", "file": "src/Staking.sol", "function": "rewardPerToken()", "description": "rewardPerToken() divides by totalStaked. If totalStaked is zero the function returns early, but if totalStaked becomes non-zero and later returns to zero via withdrawals while rewardPerTokenStored is non-zero, subsequent calls with totalStaked == 0 return the stored value, which is acceptable. However, rewardRate can be set to zero in the constructor, causing rewards to never accrue (not a vulnerability but a misconfiguration). The real high issue is that rewardRate is immutable and set at construction; if set extremely high, rewardPerToken() can overflow or produce astronomical values when multiplied by 1e18 and (block.timestamp - lastUpdate), though uint256 overflow is unlikely with realistic time deltas. More concretely, there is no validation that rewardRate > 0, and no cap, allowing a deployer to create a contract that pays out rewards faster than the rewardToken balance can support, causing claim() to revert on transfer due to insufficient contract balance, effectively locking the contract.", "attack": "Deploy StakeRewards with rewardRate = 1e36 (or any value such that rewardRate * time * 1e18 exceeds the rewardToken balance held by the contract). A user stakes and waits; claim() computes a reward r larger than the contract's rewardToken balance, and rewardToken.transfer(msg.sender, r) reverts, permanently blocking claims for all users until more tokens are deposited (which may be impossible if only the deployer can mint).", "confidence": 0.6}}, {"seq": 25, "ts": 1793270968.9988098, "type": "finding_added", "finding": {"id": "F3", "title": "Staked balance updated before token transfer, allowing reentrancy/transferFrom front-run", "severity": "medium", "file": "src/Staking.sol", "function": "stake()", "description": "stake() increments staked[msg.sender] and totalStaked before calling stakeToken.transferFrom(). If the stakeToken is a malicious ERC20 with a reentrant transferFrom hook, the token contract can call back into the Staking contract (e.g., claim() or withdraw()) during the transferFrom execution. Because staked[msg.sender] is already inflated, the reentrant call can claim rewards on a balance that has not actually been settled yet, or withdraw more than was genuinely deposited, leading to reward inflation or theft of reward tokens.", "attack": "Attacker creates a malicious token where transferFrom(from, to, amount) reenters the Staking contract by calling claim() or withdraw() on behalf of msg.sender. Victim calls stake(100e18) with the malicious token. Inside transferFrom, the reentrant claim() executes update(msg.sender), computing rewards based on the already-incremented staked[msg.sender] (100e18) even though the underlying token transfer may not have completed or may be reverted later. The attacker extracts unearned rewards. Alternatively, the malicious token's transferFrom reverts after the state update, leaving staked[msg.sender] and totalStaked inflated with no corresponding tokens in the contract, allowing the attacker to withdraw reward tokens against phantom staked balance.", "confidence": 0.65}}, {"seq": 26, "ts": 1793270968.999251, "type": "finding_added", "finding": {"id": "F4", "title": "MockToken lacks balance underflow protection", "severity": "medium", "file": "src/MockToken.sol", "function": "transfer()", "description": "MockToken.transfer() and transferFrom() perform balance subtractions without require checks. In Solidity 0.8.x this causes an underflow revert if balance is insufficient, which is safe, but the absence of allowance checks in transferFrom() means any spender can transfer any amount from any caller without approval (allowance is decremented but never checked against the requested amount). This allows unlimited token theft from users who have approved the Staking contract, because the Staking contract calls stakeToken.transferFrom(msg.sender, address(this), amt); if MockToken is used as stakeToken, a malicious actor could call MockToken.transferFrom(victim, attacker, hugeAmount) directly since allowance is not enforced, draining victim balances.", "attack": "Attacker calls MockToken.transferFrom(victim, attacker, type(uint256).max) directly. Because transferFrom does not check allowance[f][msg.sender] >= a, the subtraction underflows (revert in 0.8.x) \u2014 actually in 0.8.x it reverts, so this is not exploitable for theft. However, if the MockToken is used with a compiler version below 0.8.0, this would silently underflow. Given pragma ^0.8.24, underflow reverts. The real issue is that transferFrom decrements allowance without checking it, but since it reverts on underflow, no funds are lost. This finding is low confidence for actual exploit under 0.8.24, but the missing checks are a latent issue if the pragma is ever lowered.", "confidence": 0.3}}, {"seq": 27, "ts": 1793270969.0221093, "type": "stage_started", "stage": "research", "finding_id": "F1"}, {"seq": 28, "ts": 1793270969.0401688, "type": "firewall_decision", "layer": "L1", "kind": "net", "action": "https://api.tavily.com/search", "verdict": "allow", "rule": "net-allowlist", "reason": "api.tavily.com allowlisted", "latency_ms": 5.338, "provider": ""}, {"seq": 29, "ts": 1793270969.5508976, "type": "firewall_decision", "layer": "L2", "kind": "net", "action": "https://api.tavily.com/search", "verdict": "allow", "rule": "nemotron-policy", "reason": "Web search for public exploit write-ups is the legitimate task stage.", "latency_ms": 504.091, "provider": "nvidia"}, {"seq": 30, "ts": 1793270977.8094492, "type": "llm_call", "role": "policy", "model": "nvidia/nemotron-3.5-lightning-30b-a3b", "provider": "nvidia", "prompt_tokens": 313, "completion_tokens": 34, "latency_s": 0.499}, {"seq": 31, "ts": 1793270977.829223, "type": "llm_call", "role": "scanner", "model": "nvidia/nemotron-3.5-lightning-30b-a3b", "provider": "nvidia", "prompt_tokens": 373, "completion_tokens": 16, "latency_s": 2.784}, {"seq": 32, "ts": 1793270977.829493, "type": "llm_call", "role": "scanner", "model": "nvidi ally altering the intended values of other arguments. This misalignment can cause an"}, {"title": "August 2026 Crypto Exploits & Attacks | Nominis", "url": "https://www.nominis.io/insights/nominis-monthly-report", "snippet": "million); strip those two out and the remaining nine smart contract exploits totalled under $3 million between them. Phishing against a single private wallet accounted for a further $25.6 million (16%), governance attacks (Term Finance) $8.5 million (5%), and access control or credential compromise (MOKE, RRWallet, Coinsbuy) a combined $10.8 million (7%)."}]}, {"seq": 72, "ts": 1793271366.4991152, "type": "stage_started", "stage": "exploit", "finding_id": "F2"}, {"seq": 73, "ts": 1793271463.2810647, "type": "firewall_decision", "layer": "L1", "kind": "write", "action": "test/Exploit_F2.t.sol (1558B)", "verdict": "allow", "rule": "write-ok", "reason": "write inside jail", "latency_ms": 26.372, "provider": ""}, {"seq": 74, "ts": 1793271463.2990572, "type": "firewall_decision", "layer": "L1", "kind": "shell", "action": "forge test --match-path test/Exploit_F2.t.sol --match-test test_exploit", "verdict": "allow", "rule": "allowlist", "reason": "forge allowed", "latency_ms": 3.516, "provider": ""}, {"seq": 75, "ts": 1793271466.730426, "type": "poc_result", "finding_id": "F2", "attempt": 1, "passed": false, "confirmed": false, "test_file": "test/Exploit_F2.t.sol", "code": "// SPDX-License-Identifier: MIT\npragma solidity ^0.8.24;\n\nimport \"forge-std/Test.sol\";\nimport \"../src/MockToken.sol\";\nimport \"../src/Staking.sol\";\n\ncontract StakingExploitTest is Test {\n    address public attacker = address(0x1234);\n    address public victim = address(0x5678);\n\n    MockToken public stakeToken;\n    MockToken public rewardToken;\n    StakeRewards public staking;\n\n    function setUp() public {\n        stakeToken = new MockToken();\n        rewardToken = new MockToken();\n\n        // Attacker deploys with an astronomically high rewardRate\n // Tiny Solidity / diff highlighter. Everything is HTML-escaped first; spans are added after.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>

const KW = new Set(("pragma import contract interface library function modifier constructor event error " +
  "struct enum mapping public private internal external view pure payable returns return if else for " +
  "while do require revert emit new is memory storage calldata immutable constant override virtual " +
  "unchecked receive fallback using assembly try catch").split(" "));

function solidity(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(\b0x[0-9a-fA-F]+\b|\b\d[\d_]*(?:e\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="tk-c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-n">${esc(m[3])}</span>`;
    else if (KW.has(m[4])) out += `<span class="tk-k">${esc(m[4])}</span>`;
    else if (TY.has(m[4]) || /^[A-Z]\w*$/.test(m[4])) out += `<span class="tk-t">${esc(m[4])}</span>`;
    else out += esc(m[4]);
  }
  return out + esc(code.slice(last));
}

function diff(text) {
  return String(text ?? "").split("\n").map((l) => {
    const cls = l.startsWith("+++") || l.startsWith("---") ? "df-h" :
      l.startsWith("+") ? "df-a" : l.startsWith("-") ? "df-d" : l.startsWith("@@") ? "df-h" : "";

    <div class="hdr-top"><h1>${esc(r.repo)}</h1><span class="pill ${state}">${state}</span></div>
    <div class="stats">
      ${cell("findings", t.findings)}
      ${cell("confirmed", t.confirmed, t.confirmed ? "red" : "")}
      ${cell("patched", t.fixed, t.fixed ? "green" : "")}
      ${cell("fw denied", t.denies, t.denies ? "red" : "")}
      ${cell("quarantined", t.quarantined, t.quarantined ? "red" : "")}
      ${cell("duration", fmtDur(t.duration_s))}
      ${cell("tokens", t.tokens.toLocaleString() + (t.calls ? ` <small>(${t.calls} calls)</small>` : ""))}
      ${cell("cost", "n/a <small>no pricing configured</small>")}
      ${cell("providers", esc(t.providers.join(", ") || "-"))}
    </div></div>`;
}

const STAGE_LABEL = { baseline: "Baseline", scan: "Scan", recon: "Recon", research: "Research", exploit: "Exploit", patch: "Patch" };
function stepper(st) {
  return `<div class="stepper">${STAGES.map((s, i) => {
    const x = st.stages[s];
    const n = x.runs.length, ok = x.runs.filter((r) => r.status === "ok").length;
    const meta = x.status === "pending" ? (st.finished ? "not run" : "pending") : n > 1 || ["research", "exploit", "patch"].includes(s) ? `${ok}/${n}` : x.status;
    return `<div class="step ${x.status}"><div class="dot">${x.status === "ok" ? "&#10003;" : x.status === "fail" ? "&#10005;" : i + 1}</div>
      <div class="lbl">${STAGE_LABEL[s]}<small>${meta}</small></div></div>`;
  }).join("")}</div>`;
}

function sevChip(s) { return `<span class="sev sev-${esc(s)}">${esc(s)}</span>`; }

function findingStatus(f) {
  if (f.attempts.some((a) => a.confirmed)) return ["confirmed", "CONFIRMED", "red"];
  if (f.attempts.length && f.stage.exploit && f.stage.exploit !== "running") return ["unconfirmed", "UNCONFIRMED", "grey"];
  if (f.stage.exploit === "running") return ["testing", "TESTING PoC", "amber"];
  return ["suspected", "SUSPECTED", "grey"];
}

function findingCards(st) {
  const ids = st.order.filter((id) => st.findings[id].finding)
    .sort((a, b) => SEV[st.findings[a].finding.severity] - SEV[st.findings[b].finding.severity]);
  if (!ids.length) return `<div class="empty">No findings yet.</div>`;
  return ids.map((id) => {
    const f = st.findings[id], fd = f.finding, [, label, col] = findingStatus(f);
    const step = (name, key) => {
      const v = f.stage[key];
      return `<span class="mini ${v || "pending"}">${name}</span>`;
    };
    const patch = f.patch ? (f.patch.applied ? `<span class="mini ok">patched</span>` : `<span class="mini fail">patch failed</span>`) : "";
    return `<div class="card finding ${col}"><div class="row">${sevChip(fd.severity)}<b>${esc(fd.title)}</b>
      <span class="chip ${col}">${label}</span></div>
      <div class="muted mono">${esc(fd.file)}${fd.function ? " :: " + esc(fd.function) : ""}</div>
      <p>${esc(fd.description)}</p>
      <div class="minis">${step("research", "research")}${step("exploit", "exploit")}${patch || step("patch", "patch")}
      <span class="muted">${f.attempts.length ? f.attempts.length + " PoC attempt(s)" : ""}</span></div></div>`;
  }).join("");
}

function fwFeed(st, limit = 200) {
  if (!st.fw.length) return `<div class="empty">No firewall activity yet.</div>`;
  const t0 = st.t0;
  return `<div class="feed">${[...st.fw].reverse().slice(0, limit).map((f) => `
    <div class="fw ${f.verdict}"><span class="vd">${f.verdict === "deny" ? "DENY" : "ALLOW"}</span>
    <span class="chip lay">${esc(f.layer)}</span><span class="mono act">${esc(f.kind)} ${esc(f.action)}</span>
    <span class="why">${esc(f.rule)} &mdash; ${esc(f.reason)}</span>
    <span class="meta">${fmtMs(f.latency_ms)}${f.provider ? " &middot; " + esc(f.provider) : ""} &middot; +${(f.ts - t0).toFixed(1)}s</span></div>`).join("")}</div>`;
}

function live(st) {
  return `${stepper(st)}<div class="cols"><section><h2>Findings</h2>${findingCards(st)}</section>
    <section><h2>Firewall <small>${st.fw.length} decisions</small></h2>${fwFeed(st)}</section></div>`;
}

// ---------------- report ----------------
function code(html) { return `<pre class="code">${html}</pre>`; }

function reportFinding(st, id, rep) {
  const f = st.findings[id], fd = f.finding;
  const [, label, col] = findingStatus(f);
  const last = f.attempts[f.attempts.length - 1];
  const attempts = f.attempts.map((a) => `<details ${a === last ? "open" : ""}><summary>
      <span class="chip ${a.passed ? "red" : "grey"}">attempt ${a.attempt}: ${a.passed ? "exploit works" : a.note?.startsWith("blocked") ? "blocked by firewall" : "did not work"}</span></summary>
      ${a.note && !a.passed ? `<div class="muted small">${esc(a.note)}</div>` : ""}
      ${a.output ? code(esc(a.output)) : ""}</details>`).join("");
  const p = f.patch;
  const ba = `<div class="ba">
    <div class="ba-box red"><div class="k">before patch</div><div class="v">${f.attempts.some((a) => a.confirmed) ? "exploit PASSES &rarr; bug confirmed" : "exploit not demonstrated"}</div></div>
    <div class="arrow">&rarr;</div>
    <div class="ba-box ${p?.applied ? "green" : "grey"}"><div class="k">after patch</div><div class="v">${p ? (p.applied ? "exploit FAILS &middot; existing suite green" : "patch not accepted") : "no patch attempted"}</div></div></div>`;
  const cites = f.citations.length ? `<h4>Sources (Tavily)</h4><ul class="cites">${f.citations.map((c) =>
    `<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${esc(c.title || c.url)}</a><div class="muted small">${esc(c.snippet)}</div></li>`).join("")}</ul>` : "";
  return `<article class="card finding ${col}"><div class="row">${sevChip(fd.severity)}<b>${esc(fd.title)}</b><span class="chip ${col}">${label}</span></div>
    <div class="muted mono">${esc(fd.file)}${fd.function ? " :: " + esc(fd.function) : ""}</div>
    <p>${esc(fd.description)}</p><h4>Attack</h4><p>${esc(fd.attack)}</p>
    ${ba}
    <h4>Proof of concept <small>${f.attempts.length} attempt(s)</small></h4>${attempts || '<div class="empty">none</div>'}
    ${last?.code ? `<details open><summary>PoC code (${esc(last.test_file)})</summary>${code(solidity(last.code))}</details>` : ""}
    ${p?.diff ? `<h4>Patch <small>${p.attempts} attempt(s)</small></h4>${p.note ? `<p class="muted">${esc(p.note)}</p>` : ""}${code(diff(p.diff))}` : ""}
    ${cites}</article>`;
}

function report(st, rep) {
  const ids = st.order.filter((id) => st.findings[id].finding)
    .sort((a, b) => SEV[st.findings[a].finding.severity] - SEV[st.findings[b].finding.severity]);
  const llm = {};
  for (const c of st.llm) { const k = `${c.provider} / ${c.model}`; (llm[k] ||= { n: 0, p: 0, c: 0, s: 0 }); llm[k].n++; llm[k].p += c.prompt_tokens; llm[k].c += c.completion_tokens; llm[k].s += c.latency_s; }
  const rows = Object.entries(llm).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${v.n}</td><td>${v.p.toLocaleString()}</td><td>${v.c.toLocaleString()}</td><td>${v.s.toFixed(2)}s</td></tr>`).join("");
  return `${ids.length ? ids.map((id) => reportFinding(st, id, rep)).join("") : '<div class="empty">No findings.</div>'}
    <h2>Model calls</h2><div class="tablewrap"><table><tr><th>provider / model</th><th>calls</th><th>prompt tok</th><th>completion tok</th><th>time</th></tr>${rows || '<tr><td colspan="5" class="muted">none</td></tr>'}</table></div>`;
}

// ---------------- firewall ----------------
function quarantineFile(file, text, spans) {
  const lines = text.split("\n");
  const inSpan = (n) => spans.some((s) => n >= s.start_line && n <= s.end_line);
  return `<div class="qfile"><div class="qname mono">${esc(file)} <span class="chip red">${spans.length} span(s) quarantined</span></div>
    <pre class="code qsrc">${lines.map((l, i) => `<span class="ln">${i + 1}</span><span class="${inSpan(i + 1) ? "qhit" : ""}">${esc(l)}</span>`).join("\n")}</pre>
    ${spans.map((s) => `<div class="muted small">lines ${s.start_line}-${s.end_line}: ${esc(s.detector)} detector &mdash; ${esc(s.reason)}. The agent saw a <code>[REDACTED]</code> placeholder instead.</div>`).join("")}</div>`;
}

function firewall(st, rep) {
  const byFile = {};
  for (const q of st.quarantines) (byFile[q.file] ||= []).push(q);
  const files = Object.entries(byFile).map(([f, spans]) => {
    const text = rep?.quarantine_files?.[f];
    return text ? quarantineFile(f, text, spans) :
      `<div class="qfile"><div class="qname mono">${esc(f)}</div>${spans.map((s) => `<pre class="code"><span class="qhit">${esc(s.excerpt)}</span></pre><div class="muted small">lines ${s.start_line}-${s.end_line}: ${esc(s.detector)} &mdash; ${esc(s.reason)}</div>`).join("")}</div>`;
  }).join("");
  const denied = st.fw.filter((f) => f.verdict === "deny");
  const lat = latencyByLayer(st);
  const maxMean = Math.max(...lat.map((l) => l.mean), 0.001);
  const LNAME = { L1: "L1 deterministic rules", L2: "L2 Nemotron policy", scanner: "scanner" };
  return `<h2>Quarantined input <small>${st.quarantines.length} span(s)</small></h2>${files || '<div class="empty">Nothing quarantined.</div>'}
    <h2>Blocked actions <small>${denied.length}</small></h2>
    ${denied.length ? `<div class="feed">${denied.map((f) => `<div class="fw deny"><span class="vd">DENY</span><span class="chip lay">${esc(f.layer)}</span>
      <span class="mono act">${esc(f.kind)} ${esc(f.action)}</span><span class="why">${esc(f.rule)} &mdash; ${esc(f.reason)}</span>
      <span class="meta">${fmtMs(f.latency_ms)}</span></div>`).join("")}</div>` : '<div class="empty">No actions were blocked in this run.</div>'}
    <h2>Latency by layer</h2><div class="tablewrap"><table><tr><th>layer</th><th>decisions</th><th>mean</th><th>p50</th><th>max</th><th></th></tr>
    ${lat.map((l) => `<tr><td>${esc(LNAME[l.layer] || l.layer)}</td><td>${l.n}</td><td>${fmtMs(l.mean)}</td><td>${fmtMs(l.p50)}</td><td>${fmtMs(l.max)}</td>
      <td class="barcell"><div class="bar" style="width:${Math.max(2, (l.mean / maxMean) * 100)}%"></div></td></tr>`).join("") || '<tr><td colspan="6" class="muted">no decisions</td></tr>'}</table></div>`;
}



const $ = (s) => document.querySelector(s);
const EXPORT = window.__REDLINE_DATA__ || null;
let st = emptyState(), rep = null, view = "live", es = null, runs = [], runId = null, timer = null;

function shell() {
  $("#app").innerHTML = `<header class="top"><div class="brand"><span class="logo">&#9632;</span> REDLINE</div>
    <div class="ctl">${EXPORT ? "" : `<select id="runsel"></select>`}<button id="replay" title="Replay this run">&#9654; Replay</button></div></header>
    ${EXPORT ? "" : `<form id="auditform" class="auditform"><input id="auditurl" type="url" required placeholder="https://github.com/owner/foundry-repo" autocomplete="off"><button id="auditbtn">Audit repo</button></form><div id="auditmsg" class="auditmsg"></div>`}
    <nav class="tabs"><button data-v="live">Live</button><button data-v="report">Report</button><button data-v="firewall">Firewall</button></nav>
    <main><div id="banner"></div><div id="hdr"></div><div id="view"></div></main>`;
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { view = b.dataset.v; history.replaceState(null, "", `#${runId || ""}/${view}`); paint(); });
  $("#replay").onclick = () => start(true);
  if (!EXPORT) $("#auditform").onsubmit = submitAudit;
  if (!EXPORT) $("#runsel").onchange = (e) => { runId = e.target.value; history.replaceState(null, "", `#${runId}/${view}`); start(true); };
}

let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
function paint() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  $("#banner").innerHTML = banner(st);
  $("#hdr").innerHTML = header(st);
  const v = $("#view"), y = window.scrollY;
  v.innerHTML = view === "live" ? live(st) : view === "report" ? report(st, rep) : firewall(st, rep);
  window.scrollTo(0, y);
}

function clamp(d) { return Math.min(Math.max(d, 0.15), 2.5); }

function replayLocal(events) {
  st = emptyState();
  let i = 0, prev = null;
  const next = () => {
    if (i >= events.length) return;
    const e = events[i++];
    const wait = prev === null ? 0 : clamp(e.ts - prev) * 1000;
    prev = e.ts;
    timer = setTimeout(() => { reduce(st, e); schedule(); next(); }, wait);
  };
  next();
}

async function start(replay) {
  if (es) { es.close(); es = null; }
  clearTimeout(timer);
  st = emptyState(); rep = null; paint();
  if (EXPORT) { rep = EXPORT.report; replay ? replayLocal(EXPORT.events) : (st = fromEvents(EXPORT.events), paint()); return; }
  if (!runId) return;
  const data = await (await fetch(`/runs/${encodeURIComponent(runId)}`)).json();
  rep = data.report;
  es = new EventSource(`/runs/${encodeURIComponent(runId)}/stream`);
  const types = ["run_started", "stage_started", "stage_finished", "finding_added", "poc_result", "patch_result", "firewall_decision", "input_quarantined", "llm_call", "run_finished"];
  for (const t of types) es.addEventListener(t, (m) => { reduce(st, JSON.parse(m.data)); schedule(); });
  es.addEventListener("end", () => { es.close(); fetch(`/runs/${encodeURIComponent(runId)}`).then((r) => r.json()).then((d) => { rep = d.report; schedule(); }); });
}

async function submitAudit(e) {
  e.preventDefault();
  const btn = $("#auditbtn"), msg = $("#auditmsg");
  btn.disabled = true; msg.className = "auditmsg"; msg.textContent = "Cloning repository...";
  try {
    const r = await fetch("/audit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("#auditurl").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "request failed");
    msg.textContent = "Audit started.";
    for (let i = 0; i < 40; i++) {
      if ((await fetch(`/runs/${d.run_id}`)).ok) break;
      await new Promise((ok) => setTimeout(ok, 500));
    }
    runs = await (await fetch("/runs")).json();
    $("#runsel").innerHTML = runs.map((x) => `<option value="${x.id}">${x.id}${x.scripted ? " (SAMPLE)" : ""} - ${x.status}</option>`).join("");
    runId = d.run_id; $("#runsel").value = runId; view = "live";
    history.replaceState(null, "", `#${runId}/live`);
    start(false);
  } catch (err) { msg.className = "auditmsg err"; msg.textContent = String(err.message || err); }
  btn.disabled = false;
}

async function boot() {
  shell();
  const [h, v] = location.hash.slice(1).split("/");
  if (["live", "report", "firewall"].includes(v)) view = v;
  if (EXPORT) { runId = EXPORT.id; st = fromEvents(EXPORT.events); rep = EXPORT.report; paint(); return; }
  runs = await (await fetch("/runs")).json();
  $("#runsel").innerHTML = runs.map((r) => `<option value="${r.id}">${r.id}${r.scripted ? " (SAMPLE)" : ""} - ${r.status}</option>`).join("");
  runId = runs.find((r) => r.id === h)?.id || runs[0]?.id;
  if (runId) $("#runsel").value = runId;
  if (!runId) { $("#view").innerHTML = `<div class="empty">No runs yet. Run <code>redline audit</code> or <code>python scripts/gen_samples.py</code>.</div>`; return; }
  start(true);
}
boot();

})();</script></body></html>
