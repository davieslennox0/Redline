", "attack": "1. Attacker deploys a contract with a fallback that calls vault.withdraw() again.\n2. Attacker deposits 1 ETH into the vault.\n3. Attacker calls withdraw(1 ETH).\n4. Vault checks balance (1 ETH >= 1 ETH), then sends 1 ETH to attacker's contract.\n5. Attacker's fallback triggers, calls withdraw(1 ETH) again.\n6. Vault balance check still passes (balance not yet decremented), sends another 1 ETH.\n7. Loop repeats until vault balance is exhausted.\n8. After the external calls return, the unchecked balance decrements execute but underflow is prevented by unchecked arithmetic, leaving balances corrupted.", "confidence": 0.99}}, {"seq": 22, "ts": 1793264552.122559, "type": "stage_started", "stage": "research", "finding_id": "F1"}, {"seq": 23, "ts": 1793264552.1443627, "type": "firewall_decision", "layer": "L1", "kind": "net", "action": "https://api.tavily.com/search", "verdict": "allow", "rule": "net-allowlist", "reason": "api.tavily.com allowlisted", "latency_ms": 8.365, "provider": ""}, {"seq": 24, "ts": 1793264552.71515, "type": "firewall_decision", "layer": "L2", "kind": "net", "action": "https://api.tavily.com/search", "verdict": "allow", "rule": "nemotron-policy", "reason": "Web search for public exploit write-ups via Tavily is an allowed part of the web research stage.", "latency_ms": 563.343, "provider": "nvidia"}, {"seq": 25, "ts": 1793264561.3585496, "type": "llm_call", "role": "policy", "model": "nvidia/nemotron-3.5-lightning-30b-a3b", "provider": "nvidia", "prompt_tokens": 316, "completion_tokens": 41, "latency_s": 0.559}, {"seq": 26, "ts": 1793264561.403384, "type": "llm_call", "role": "scanner", "model": "nvidia/nemotron-3.5-lightning-30b-a3b", "provider": "nvidia", "prompt_tokens": 377, "completion_tokens": 16, "latency_s": 0.664}, {"seq": 27, "ts": 1793264561.4042957, "type": "llm_call", "role": "scanner", "model": "nvidia/nemotron-3.5-lightning-30b-a3b", "provider": "nvidia", "prompt_tokens": 517, "completion_tokens": 30, "latency_s": 0.455} fails to update its state before sending funds, the attacker can continuously call the withdraw function to drain the contract\u2019s funds. A famous real-world Reentrancy attack is the DAO attack which caused a loss of 60 million US dollars.\n\n## How Does Reentrancy Attack Work?\n\nA reentrancy attack involves two smart contracts. A vulnerable contract and an untrusted attacker\u2019s contra"}, {"title": "Understanding Re-entrancy in Smart Contracts \u2013 SolidityScan Blogs", "url": "https://blog.solidityscan.com/understanding-re-entrancy-in-smart-contracts-97cb67ecbb07", "snippet": "The reentrancy technique may prove a huge vulnerability for your Solidity smart contracts. It transfers the control flow to an untrusted contract that intends to drain funds. Let us explore it in detail. [...] #### Example 1\n\n```\nfunction withdraw() external {  \n uint256 amount = balances[msg.sender];  \n require(msg.sender.call.value(amount)());  \n balances[msg.sender] = 0;  \n}\n```\n\nThe attacker e"}]}, {"seq": 31, "ts": 1793264561.4460082, "type": "stage_started", "stage": "exploit", "finding_id": "F1"}, {"seq": 32, "ts": 1793264682.4069424, "type": "firewall_decision", "layer": "L1", "kind": "write", "action": "test/Exploit_F1.t.sol (2678B)", "verdict": "allow", "rule": "write-ok", "reason": "write inside jail", "latency_ms": 59.998, "provider": ""}, {"seq": 33, "ts": 1793264682.4285703, "type": "firewall_decision", "layer": "L1", "kind": "shell", "action": "forge test --match-path test/Exploit_F1.t.sol --match-test test_exploit", "verdict": "allow", "rule": "allowlist", "reason": "forge allowed", "latency_ms": 3.804, "provider": ""}, {"seq": 34, "ts": 1793264696.566621, "type": "poc_result", "finding_id": "F1", "attempt": 1, "passed": true, "confirmed": true, "test_file": "test/Exploit_F1.t.sol", "code": "// SPDX-License-Identifier: MIT\npragma solidity ^0.8.24;\n\nimport \"forge-std/Test.sol\";\nimport \"../src/Vault.sol\";\n\ncontract ReentrancyAttacker {\n    address p // Tiny Solidity / diff highlighter. Everything is HTML-escaped first; spans are added after.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

const KW = new Set(("pragma import contract interface library function modifier constructor event error " +
  "struct enum mapping public private internal external view pure payable returns return if else for " +
  "while do require revert emit new is memory storage calldata immutable constant override virtual " +
  "unchecked receive fallback using assembly try catch").split(" "));
const TY = new Set(("uint uint8 uint128 uint256 int int256 address bool bytes bytes32 string").split(" "));

function solidity(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*")|(\b0x[0-9a-fA-F]+\b|\b\d[\d_]*(?:e\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    last = re.lastIndex;
    if (m[1]) out += `<span class="tk-c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="tk-s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="tk-n">${esc(m[3])}</span>`;
    else if (KW.has(m[4])) out += `<span class="tk-k">${esc(m[4])}</span>`;
    else if (TY.has(m[4]) || /^[A-Z]\w*$/.test(m[4])) out += `<span class="tk-t">${esc(m[4])}</span>`;
    else out += esc(m[4]);
  }
  return out + esc(code.slice(last));
}

function diff(text) {
  return String(text ?? "").split("\n").map((l) => {
    const cls = l.startsWith("+++") || l.startsWith("---") ? "df-h" :
      l.startsWith("+") ? "df-a" : l.startsWith("-") ? "df-d" : l.startsWith("@@") ? "df-h" : "";
    return `<span class="${cls}">${esc(l)}</span>`;
  }).join("\n");
}

// Pure reducer: events -> view state. The same code runs live (SSE), on replay and in the export.
const STAGES = ["baseline", "scan", "recon", "research", "exploit", "patch"];

function emptyState() {
  return {
    run: null, finished: null, t0: null, tNow: null,
    stages: Object.fromEntries(STAGES.map((s) => [s, { status: "pending", runs: [] }])),
    findings: {}, order: [], fw: [], quarantines: [], llm: [],
  };
}

function finding(st, id) {
  if (!st.findings[id]) {
    st.findings[id] = { finding: null, attempts: [], patch: null, citations: [], stage: {} };
    st.order.push(id);
  }
  return st.findings[id];
}

function reduce(st, e) {
  st.tNow = e.ts;
  if (st.t0 === null) st.t0 = e.ts;
  switch (e.type) {
    case "run_started": st.run = e; break;
    case "stage_started": {
      const s = st.stages[e.stage];
      s.runs.push({ id: e.finding_id, status: "running" });
      if (e.finding_id) finding(st, e.finding_id).stage[e.stage] = "running";
      s.status = "running";
      break;
    }
    case "stage_finished": {
      const s = st.stages[e.stage];
      const r = [...s.runs].reverse().find((x) => x.id === e.finding_id && x.status === "running");
      if (r) Object.assign(r, { status: e.ok ? "ok" : "fail", detail: e.detail, duration_s: e.duration_s });
      s.status = s.runs.some((x) => x.status === "running") ? "running"
        : s.runs.every((x) => x.status === "ok") ? "ok" : "fail";
      if (e.finding_id) {
        const f = finding(st, e.finding_id);
        f.stage[e.stage] = e.ok ? "ok" : "fail";
        if (e.citations?.length) f.citations = e.citations;
      }
      break;
    }
    case "finding_added": finding(st, e.finding.id).finding = e.finding; break;
    case "poc_result": finding(st, e.finding_id).attempts.push(e); break;
    case "patch_result": finding(st, e.finding_id).patch = e; break;
    case "firewall_decision": st.fw.push(e); break;
    case "input_quarantined": st.quarantines.push(e); break;
    case "llm_call": st.llm.push(e); break;
    case "run_finished": st.finished = e; break;
  }
  return st;
}

function fromEvents(events) {
  const st = emptyState();
  for (const e of events) reduce(st, e);
  return st;
}

function totals(st) {
  const tok = st.llm.reduce((a, c) => a + c.prompt_tokens + c.completion_tokens, 0);
  const providers = [...new Set(st.llm.map((c) => c.provider).concat(st.run ? [st.run.provider] : []))];
  const confirmed = st.order.filter((id) => st.findings[id].attempts.some((a) => a.confirmed)).length;
  const fixed = st.order.filter((id) => st.findings[id].patch?.applied).length;
  const dur = st.finished ? st.finished.duration_s : (st.tNow && st.t0 ? st.tNow - st.t0 : 0);
  return {
    findings: st.order.filter((id) => st.findings[id].finding).length, confirmed, fixed,
    tokens: tok, calls: st.llm.length, providers, duration_s: dur,
    denies: st.fw.filter((f) => f.verdict === "deny").length, allows: st.fw.filter((f) => f.verdict === "allow").length,
    quarantined: st.quarantines.length,
  };
}

function latencyByLayer(st) {
  const by = {};
  for (const f of st.fw) (by[f.layer] ||= []).push(f.latency_ms);
  return Object.entries(by).map(([layer, a]) => {
    a.sort((x, y) => x - y);
    const sum = a.reduce((x, y) => x + y, 0);
    return { layer, n: a.length, mean: sum / a.length, p50: a[Math.floor(a.length / 2)], max: a[a.length - 1] };
  }).sort((x, y) => x.layer.localeCompare(y.layer));
}



const fmtDur = (s) => (s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${s.toFixed(1)}s`);
const fmtMs = (ms) => (ms >= 100 ? `${ms.toFixed(0)}ms` : `${ms.toFixed(2)}ms`);
const SEV = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };

function banner(st) {
  if (!st.run?.scripted) return "";
  return `<div class="banner"><b>SAMPLE &mdash; scripted model.</b> Model text in this run was replayed
    from a script, not produced by an LLM. Forge execution, the scanner and the firewall are real.
    Token counts are 0 because no model was called.</div>`;
}

function header(st) {
  const t = totals(st), r = st.run;
  if (!r) return `<div class="hdr"><div class="muted">waiting for run&hellip;</div></div>`;
  const state = st.finished ? (st.finished.ok ? "finished" : "failed") : "running";
  const cell = (k, v, cls = "") => `<div class="stat ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="hdr">
    <div class="hdr-top"><h1>${esc(r.repo)}</h1><span class="pill ${state}">${state}</span></div>
    <div class="stats">
      ${cell("findings", t.findings)}
      ${cell("confirmed", t.confirmed, t.confirmed ? "red" : "")}
      ${cell("patched", t.fixed, t.fixed ? "green" : "")}
      ${cell("fw denied", t.denies, t.denies ? "red" : "")}
      ${cell("quarantined", t.quarantined, t.quarantined ? "red" : "")}
      ${cell("duration", fmtDur(t.duration_s))}
      ${cell("tokens", t.tokens.toLocaleString() + (t.calls ? ` <small>(${t.calls} calls)</small>` : ""))}
      ${cell("cost", "n/a <small>no pricing configured</small>")}
      ${cell("providers", esc(t.providers.join(", ") || "-"))}
    </div></div>`;
}

const STAGE_LABEL = { baseline: "Baseline", scan: "Scan", recon: "Recon", research: "Research", exploit: "Exploit", patch: "Patch" };
function stepper(st) {
  return `<div class="stepper">${STAGES.map((s, i) => {
    const x = st.stages[s];
    const n = x.runs.length, ok = x.runs.filter((r) => r.status === "ok").length;
    const meta = x.status === "pending" ? (st.finished ? "not run" : "pending") : n > 1 || ["research", "exploit", "patch"].includes(s) ? `${ok}/${n}` : x.status;
    return `<div class="step ${x.status}"><div class="dot">${x.status === "ok" ? "&#10003;" : x.status === "fail" ? "&#10005;" : i + 1}</div>
      <div class="lbl">${STAGE_LABEL[s]}<small>${meta}</small></div></div>`;
  }).join("")}</div>`;
}

function sevChip(s) { return `<span class="sev sev-${esc(s)}">${esc(s)}</span>`; }

function findingStatus(f) {
  if (f.attempts.some((a) => a.confirmed)) return ["confirmed", "CONFIRMED", "red"];
  if (f.attempts.length && f.stage.exploit && f.stage.exploit !== "running") return ["unconfirmed", "UNCONFIRMED", "grey"];
  if (f.stage.exploit === "running") return ["testing", "TESTING PoC", "amber"];
  return ["suspected", "SUSPECTED", "grey"];
}

function findingCards(st) {
  const ids = st.order.filter((id) => st.findings[id].finding)
    .sort((a, b) => SEV[st.findings[a].finding.severity] - SEV[st.findings[b].finding.severity]);
  if (!ids.length) return `<div class="empty">No findings yet.</div>`;
  return ids.map((id) => {
    const f = st.findings[id], fd = f.finding, [, label, col] = findingStatus(f);
    const step = (name, key) => {
      const v = f.stage[key];
      return `<span class="mini ${v || "pending"}">${name}</span>`;
    };
    const patch = f.patch ? (f.patch.applied ? `<span class="mini ok">patched</span>` : `<span class="mini fail">patch failed</span>`) : "";
    return `<div class="card finding ${col}"><div class="row">${sevChip(fd.severity)}<b>${esc(fd.title)}</b>
      <span class="chip ${col}">${label}</span></div>
      <div class="muted mono">${esc(fd.file)}${fd.function ? " :: " + esc(fd.function) : ""}</div>
      <p>${esc(fd.description)}</p>
      <div class="minis">${step("research", "research")}${step("exploit", "exploit")}${patch || step("patch", "patch")}
      <span class="muted">${f.attempts.length ? f.attempts.length + " PoC attempt(s)" : ""}</span></div></div>`;
  }).join("");
}

function fwFeed(st, limit = 200) {
  if (!st.fw.length) return `<div class="empty">No firewall activity yet.</div>`;
  const t0 = st.t0;
  return `<div class="feed">${[...st.fw].reverse().slice(0, limit).map((f) => `
    <div class="fw ${f.verdict}"><span class="vd">${f.verdict === "deny" ? "DENY" : "ALLOW"}</span>
    <span class="chip lay">${esc(f.layer)}</span><span class="mono act">${esc(f.kind)} ${esc(f.action)}</span>
    <span class="why">${esc(f.rule)} &mdash; ${esc(f.reason)}</span>
    <span class="meta">${fmtMs(f.latency_ms)}${f.provider ? " &middot; " + esc(f.provider) : ""} &middot; +${(f.ts - t0).toFixed(1)}s</span></div>`).join("")}</div>`;
}

function live(st) {
  return `${stepper(st)}<div class="cols"><section><h2>Findings</h2>${findingCards(st)}</section>
    <section><h2>Firewall <small>${st.fw.length} decisions</small></h2>${fwFeed(st)}</section></div>`;
}

function report(st, rep) {
  const ids = st.order.filter((id) => st.findings[id].finding)
    .sort((a, b) => SEV[st.findings[a].finding.severity] - SEV[st.findings[b].finding.severity]);
  const llm = {};
  for (const c of st.llm) { const k = `${c.provider} / ${c.model}`; (llm[k] ||= { n: 0, p: 0, c: 0, s: 0 }); llm[k].n++; llm[k].p += c.prompt_tokens; llm[k].c += c.completion_tokens; llm[k].s += c.latency_s; }
  const rows = Object.entries(llm).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${v.n}</td><td>${v.p.toLocaleString()}</td><td>${v.c.toLocaleString()}</td><td>${v.s.toFixed(2)}s</td></tr>`).join("");
  return `${ids.length ? ids.map((id) => reportFinding(st, id, rep)).join("") : '<div class="empty">No findings.</div>'}
    <h2>Model calls</h2><div class="tablewrap"><table><tr><th>provider / model</th><th>calls</th><th>prompt tok</th><th>completion tok</th><th>time</th></tr>${rows || '<tr><td colspan="5" class="muted">none</td></tr>'}</table></div>`;
}

// ---------------- firewall ----------------
function quarantineFile(file, text, spans) {
  const lines = text.split("\n");
  const inSpan = (n) => spans.some((s) => n >= s.start_line && n <= s.end_line);
  return `<div class="qfile"><div class="qname mono">${esc(file)} <span class="chip red">${spans.length} span(s) quarantined</span></div>
    <pre class="code qsrc">${lines.map((l, i) => `<span class="ln">${i + 1}</span><span class="${inSpan(i + 1) ? "qhit" : ""}">${esc(l)}</span>`).join("\n")}</pre>
    ${spans.map((s) => `<div class="muted small">lines ${s.start_line}-${s.end_line}: ${esc(s.detector)} detector &mdash; ${esc(s.reason)}. The agent saw a <code>[REDACTED]</code> placeholder instead.</div>`).join("")}</div>`;
}

function firewall(st, rep) {
  const byFile = {};
  for (const q of st.quarantines) (byFile[q.file] ||= []).push(q);
  const files = Object.entries(byFile).map(([f, spans]) => {
    const text = rep?.quarantine_files?.[f];
    return text ? quarantineFile(f, text, spans) :
      `<div class="qfile"><div class="qname mono">${esc(f)}</div>${spans.map((s) => `<pre class="code"><span class="qhit">${esc(s.excerpt)}</span></pre><div class="muted small">lines ${s.start_line}-${s.end_line}: ${esc(s.detector)} &mdash; ${esc(s.reason)}</div>`).join("")}</div>`;
  }).join("");
  const denied = st.fw.filter((f) => f.verdict === "deny");
  const lat = latencyByLayer(st);
  const maxMean = Math.max(...lat.map((l) => l.mean), 0.001);
  const LNAME = { L1: "L1 deterministic rules", L2: "L2 Nemotron policy", scanner: "scanner" };
  return `<h2>Quarantined input <small>${st.quarantines.length} span(s)</small></h2>${files || '<div class="empty">Nothing quarantined.</div>'}
    <h2>Blocked actions <small>${denied.length}</small></h2>
    ${denied.length ? `<div class="feed">${denied.map((f) => `<div class="fw deny"><span class="vd">DENY</span><span class="chip lay">${esc(f.layer)}</span>
      <span class="mono act">${esc(f.kind)} ${esc(f.action)}</span><span class="why">${esc(f.rule)} &mdash; ${esc(f.reason)}</span>
      <span class="meta">${fmtMs(f.latency_ms)}</span></div>`).join("")}</div>` : '<div class="empty">No actions were blocked in this run.</div>'}
    <h2>Latency by layer</h2><div class="tablewrap"><table><tr><th>layer</th><th>decisions</th><th>mean</th><th>p50</th><th>max</th><th></th></tr>
    ${lat.map((l) => `<tr><td>${esc(LNAME[l.layer] || l.layer)}</td><td>${l.n}</td><td>${fmtMs(l.mean)}</td><td>${fmtMs(l.p50)}</td><td>${fmtMs(l.max)}</td>
      <td class="barcell"><div class="bar" style="width:${Math.max(2, (l.mean / maxMean) * 100)}%"></div></td></tr>`).join("") || '<tr><td colspan="6" class="muted">no decisions</td></tr>'}</table></div>`;
}



const $ = (s) => document.querySelector(s);
const EXPORT = window.__REDLINE_DATA__ || null;
let st = emptyState(), rep = null, view = "live", es = null, runs = [], runId = null, timer = null;

function shell() {
  $("#app").innerHTML = `<header class="top"><div class="brand"><span class="logo">&#9632;</span> REDLINE</div>
    <div class="ctl">${EXPORT ? "" : `<select id="runsel"></select>`}<button id="replay" title="Replay this run">&#9654; Replay</button></div></header>
    ${EXPORT ? "" : `<form id="auditform" class="auditform"><input id="auditurl" type="url" required placeholder="https://github.com/owner/foundry-repo" autocomplete="off"><button id="auditbtn">Audit repo</button></form><div id="auditmsg" class="auditmsg"></div>`}
    <nav class="tabs"><button data-v="live">Live</button><button data-v="report">Report</button><button data-v="firewall">Firewall</button></nav>
    <main><div id="banner"></div><div id="hdr"></div><div id="view"></div></main>`;
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { view = b.dataset.v; history.replaceState(null, "", `#${runId || ""}/${view}`); paint(); });
  $("#replay").onclick = () => start(true);
  if (!EXPORT) $("#auditform").onsubmit = submitAudit;
  if (!EXPORT) $("#runsel").onchange = (e) => { runId = e.target.value; history.replaceState(null, "", `#${runId}/${view}`); start(true); };
}

let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); }
function paint() {
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
  $("#banner").innerHTML = banner(st);
  $("#hdr").innerHTML = header(st);
  const v = $("#view"), y = window.scrollY;
  v.innerHTML = view === "live" ? live(st) : view === "report" ? report(st, rep) : firewall(st, rep);
  window.scrollTo(0, y);
}

function clamp(d) { return Math.min(Math.max(d, 0.15), 2.5); }

function replayLocal(events) {
  st = emptyState();
  let i = 0, prev = null;
  const next = () => {
    if (i >= events.length) return;
    const e = events[i++];
    const wait = prev === null ? 0 : clamp(e.ts - prev) * 1000;
    prev = e.ts;
    timer = setTimeout(() => { reduce(st, e); schedule(); next(); }, wait);
  };
  next();
}

async function start(replay) {
  if (es) { es.close(); es = null; }
  clearTimeout(timer);
  st = emptyState(); rep = null; paint();
  if (EXPORT) { rep = EXPORT.report; replay ? replayLocal(EXPORT.events) : (st = fromEvents(EXPORT.events), paint()); return; }
  if (!runId) return;
  const data = await (await fetch(`/runs/${encodeURIComponent(runId)}`)).json();
  rep = data.report;
  es = new EventSource(`/runs/${encodeURIComponent(runId)}/stream`);
  const types = ["run_started", "stage_started", "stage_finished", "finding_added", "poc_result", "patch_result", "firewall_decision", "input_quarantined", "llm_call", "run_finished"];
  for (const t of types) es.addEventListener(t, (m) => { reduce(st, JSON.parse(m.data)); schedule(); });
  es.addEventListener("end", () => { es.close(); fetch(`/runs/${encodeURIComponent(runId)}`).then((r) => r.json()).then((d) => { rep = d.report; schedule(); }); });
}

async function submitAudit(e) {
  e.preventDefault();
  const btn = $("#auditbtn"), msg = $("#auditmsg");
  btn.disabled = true; msg.className = "auditmsg"; msg.textContent = "Cloning repository...";
  try {
    const r = await fetch("/audit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("#auditurl").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "request failed");
    msg.textContent = "Audit started.";
    for (let i = 0; i < 40; i++) {
      if ((await fetch(`/runs/${d.run_id}`)).ok) break;
      await new Promise((ok) => setTimeout(ok, 500));
    }
    runs = await (await fetch("/runs")).json();
    $("#runsel").innerHTML = runs.map((x) => `<option value="${x.id}">${x.id}${x.scripted ? " (SAMPLE)" : ""} - ${x.status}</option>`).join("");
    runId = d.run_id; $("#runsel").value = runId; view = "live";
    history.replaceState(null, "", `#${runId}/live`);
    start(false);
  } catch (err) { msg.className = "auditmsg err"; msg.textContent = String(err.message || err); }
  btn.disabled = false;
}

async function boot() {
  shell();
  const [h, v] = location.hash.slice(1).split("/");
  if (["live", "report", "firewall"].includes(v)) view = v;
  if (EXPORT) { runId = EXPORT.id; st = fromEvents(EXPORT.events); rep = EXPORT.report; paint(); return; }
  runs = await (await fetch("/runs")).json();
  $("#runsel").innerHTML = runs.map((r) => `<option value="${r.id}">${r.id}${r.scripted ? " (SAMPLE)" : ""} - ${r.status}</option>`).join("");
  runId = runs.find((r) => r.id === h)?.id || runs[0]?.id;
  if (runId) $("#runsel").value = runId;
  if (!runId) { $("#view").innerHTML = `<div class="empty">No runs yet. Run <code>redline audit</code> or <code>python scripts/gen_samples.py</code>.</div>`; return; }
  start(true);
}
boot();

})();</script></body></html>
